
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xanh24 Admin - Pioneer Leads</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-7xl mx-auto p-4 md:p-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Xanh24 Pioneer - Admin Dashboard</h1>
      <p class="text-sm text-gray-600 mt-1">Quản lý 500 suất Pioneer • Kết nối MB Bank x VNPT</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportCSV()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-semibold hover:bg-gray-50">📥 Xuất CSV</button>
      <button onclick="exportExcel()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-bold hover:bg-green-700">📊 Xuất Excel</button>
      <button onclick="loadData()" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-bold">🔄 Refresh</button>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500">Tổng leads</div><div id="stat-total" class="text-2xl font-bold">-</div></div>
    <div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500">🎓 Sinh viên</div><div id="stat-sv" class="text-2xl font-bold text-green-600">-</div></div>
    <div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500">🏫 Nhà trường</div><div id="stat-truong" class="text-2xl font-bold text-blue-600">-</div></div>
    <div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500">🤝 Đối tác</div><div id="stat-doitac" class="text-2xl font-bold text-purple-600">-</div></div>
  </div>

  <div class="bg-white rounded-xl border p-4 mb-4 flex flex-col md:flex-row gap-3">
    <input id="search" type="text" placeholder="Tìm tên, SĐT, email, trường..." class="flex-1 px-4 py-2 border rounded-lg text-sm" oninput="filterData()">
    <select id="filter-type" class="px-4 py-2 border rounded-lg text-sm" onchange="filterData()">
      <option value="">Tất cả đối tượng</option>
      <option value="sinh_vien">🎓 Sinh viên</option>
      <option value="nha_truong">🏫 Nhà trường</option>
      <option value="doi_tac">🤝 Đối tác</option>
    </select>
    <select id="filter-city" class="px-4 py-2 border rounded-lg text-sm" onchange="filterData()">
      <option value="">Tất cả thành phố</option>
      <option value="Hà Nội">Hà Nội</option>
      <option value="TP. Hồ Chí Minh">TP.HCM</option>
      <option value="Đà Nẵng">Đà Nẵng</option>
      <option value="Hải Phòng">Hải Phòng</option>
      <option value="Cần Thơ">Cần Thơ</option>
    </select>
    <button onclick="sendBulkEmail()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold">📧 Gửi mail hàng loạt</button>
    <button onclick="sendBulkSMS()" class="px-4 py-2 bg-orange-600 text-white rounded-lg text-sm font-semibold">💬 SMS hàng loạt</button>
  </div>

  <div class="bg-white rounded-xl border overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b"><tr>
          <th class="text-left p-3"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
          <th class="text-left p-3 font-semibold">Thời gian</th>
          <th class="text-left p-3 font-semibold">Đối tượng</th>
          <th class="text-left p-3 font-semibold">Tên</th>
          <th class="text-left p-3 font-semibold">Thành phố</th>
          <th class="text-left p-3 font-semibold">SĐT</th>
          <th class="text-left p-3 font-semibold">Email</th>
          <th class="text-left p-3 font-semibold">Nội dung công việc</th>
          <th class="text-left p-3 font-semibold">Hành động</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="9" class="p-8 text-center text-gray-500">Đang tải data...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Email Modal -->
<div id="email-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl max-w-2xl w-full p-6">
    <h3 class="font-bold text-lg mb-4">Gửi email tự động</h3>
    <label class="text-xs font-semibold">Tiêu đề</label>
    <input id="email-subject" class="w-full border rounded-lg p-3 mt-1 mb-3 text-sm" value="[Xanh24 Pioneer] Xác nhận giữ suất thành công - 500 suất đầu tiên">
    <label class="text-xs font-semibold">Nội dung (dùng {{ten}}, {{sdt}}, {{thanhpho}} )</label>
    <textarea id="email-body" rows="8" class="w-full border rounded-lg p-3 mt-1 text-sm">Chào {{ten}},

Cảm ơn bạn đã đăng ký giữ suất Pioneer của Xanh24!

Thông tin của bạn:
- Đối tượng: {{doituong}}
- Thành phố: {{thanhpho}}
- SĐT: {{sdt}}
- Nội dung: {{noidung}}

Đội ngũ Xanh24 sẽ gọi bạn trong 15 phút để xác nhận.

Trân trọng,
Xanh24 x MB Bank x VNPT
Hotline: 1900 2468
</textarea>
    <div class="flex gap-2 mt-4 justify-end">
      <button onclick="closeModal('email-modal')" class="px-4 py-2 border rounded-lg text-sm">Hủy</button>
      <button onclick="confirmSendEmail()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold">Gửi email</button>
    </div>
  </div>
</div>

<script>
const SB_URL="https://imwzcdobpvuuwfadaxbb.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 127 bytes].sN4jiyBUMfbLDrwsO0w3XDIgwn-LzLd25L8R_yIV10E";
let allData=[]; let filtered=[];
function formatDate(d){return new Date(d).toLocaleString('vi-VN');}
function getTypeLabel(t){if(t==='sinh_vien')return '🎓 Sinh viên';if(t==='nha_truong')return '🏫 Nhà trường';if(t==='doi_tac')return '🤝 Đối tác';return t||'Khác';}

async function loadData(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='<tr><td colspan=9 class="p-8 text-center">Đang tải...</td></tr>';
  try{
    const r=await fetch(SB_URL+'/rest/v1/pioneer_leads?select=*&order=created_at.desc&limit=1000',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    const data=await r.json();
    console.log(data);
    if(!Array.isArray(data)) throw new Error(JSON.stringify(data));
    allData=data;
    updateStats();
    filterData();
  }catch(e){tbody.innerHTML=`<tr><td colspan=9 class="p-8 text-center text-red-600">Lỗi: ${e.message}</td></tr>`;}
}
function updateStats(){
  document.getElementById('stat-total').textContent=allData.length;
  document.getElementById('stat-sv').textContent=allData.filter(d=>d.customer_type==='sinh_vien'||!d.customer_type).length;
  document.getElementById('stat-truong').textContent=allData.filter(d=>d.customer_type==='nha_truong').length;
  document.getElementById('stat-doitac').textContent=allData.filter(d=>d.customer_type==='doi_tac').length;
}
function filterData(){
  const q=document.getElementById('search').value.toLowerCase();
  const type=document.getElementById('filter-type').value;
  const city=document.getElementById('filter-city').value;
  filtered=allData.filter(d=>{
    const matchQ=!q|| (d.full_name?.toLowerCase().includes(q) || d.phone?.includes(q) || d.email?.toLowerCase().includes(q) || d.school?.toLowerCase().includes(q) || d.city?.toLowerCase().includes(q));
    const matchType=!type||d.customer_type===type;
    const matchCity=!city||d.city===city;
    return matchQ&&matchType&&matchCity;
  });
  renderTable();
}
function renderTable(){
  const tbody=document.getElementById('tbody');
  if(filtered.length===0){tbody.innerHTML='<tr><td colspan=9 class="p-8 text-center text-gray-500">Không có data</td></tr>';return;}
  tbody.innerHTML=filtered.map(d=>`
    <tr class="border-b hover:bg-gray-50">
      <td class="p-3"><input type="checkbox" class="row-check" data-id="${d.id}"></td>
      <td class="p-3 text-xs text-gray-500">${formatDate(d.created_at)}</td>
      <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${d.customer_type==='sinh_vien'?'bg-green-100 text-green-700':d.customer_type==='nha_truong'?'bg-blue-100 text-blue-700':'bg-purple-100 text-purple-700'}">${getTypeLabel(d.customer_type)}</span></td>
      <td class="p-3 font-semibold">${d.full_name||''}</td>
      <td class="p-3">${d.city||''}</td>
      <td class="p-3"><a href="tel:${d.phone}" class="text-blue-600 font-mono">${d.phone||''}</a></td>
      <td class="p-3 text-xs">${d.email||''}</td>
      <td class="p-3 max-w-xs truncate" title="${d.work_content||d.school||''}">${d.work_content||d.school||''}</td>
      <td class="p-3 flex gap-1">
        <button onclick="sendSingleEmail('${d.id}')" class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-xs">Mail</button>
        <button onclick="window.open('https://wa.me/84'+'${d.phone?.replace(/^0/, '')}','_blank')" class="px-2 py-1 bg-green-50 text-green-600 rounded text-xs">WA</button>
      </td>
    </tr>
  `).join('');
}
function toggleAll(el){document.querySelectorAll('.row-check').forEach(c=>c.checked=el.checked);}
function exportCSV(){
  const headers=['created_at','customer_type','full_name','city','phone','email','work_content','school'];
  const rows=[headers.join(',')].concat(filtered.map(d=>headers.map(h=>`"${(d[h]||'').toString().replace(/"/g,'""')}"`.trim()).join(',')));
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`xanh24-pioneer-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
function exportExcel(){
  // Simple Excel via CSV with BOM for Vietnamese
  const headers=['Ngày','Đối tượng','Tên','Thành phố','SĐT','Email','Nội dung công việc','Ghi chú'];
  const rows=[headers.join('\t')].concat(filtered.map(d=>[formatDate(d.created_at),d.customer_type||'',d.full_name||'',d.city||'',d.phone||'',d.email||'',(d.work_content||'').replace(/\n/g,' '),d.school||''].join('\t')));
  const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'application/vnd.ms-excel'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`xanh24-pioneer-${new Date().toISOString().slice(0,10)}.xls`; a.click();
}
function sendBulkEmail(){document.getElementById('email-modal').classList.remove('hidden');document.getElementById('email-modal').classList.add('flex');}
function closeModal(id){document.getElementById(id).classList.add('hidden');}
function confirmSendEmail(){
  const subject=document.getElementById('email-subject').value;
  const body=document.getElementById('email-body').value;
  const selected=[...document.querySelectorAll('.row-check:checked')].map(c=>filtered.find(d=>d.id===c.dataset.id)).filter(Boolean);
  const targets=selected.length?selected:filtered;
  if(targets.length===0){alert('Chưa chọn data');return;}
  // Open mailto for each? For demo, open Gmail compose with first
  const emails=targets.map(t=>t.email).filter(Boolean);
  if(emails.length===0){alert('Không có email trong data đã chọn. Hãy xuất CSV và import vào tool gửi mail. Mẫu email đã copy!');return;}
  // Build mailto with bcc
  const bcc=emails.join(',');
  const first=targets[0];
  let personalized=body.replace(/{{ten}}/g,first.full_name||'').replace(/{{sdt}}/g,first.phone||'').replace(/{{thanhpho}}/g,first.city||'').replace(/{{doituong}}/g,getTypeLabel(first.customer_type)).replace(/{{noidung}}/g,first.work_content||first.school||'');
  const mailto=`mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(personalized)}`;
  window.open(mailto,'_blank');
  closeModal('email-modal');
  alert(`Đã mở trình gửi mail cho ${targets.length} leads (${emails.length} có email).\n\nĐể gửi SMS/Zalo tự động, hãy xuất Excel và import vào Sapo/Zalo OA.`);
}
function sendSingleEmail(id){
  const d=filtered.find(x=>x.id===id)||allData.find(x=>x.id===id);
  if(!d||!d.email){alert('Lead này không có email');return;}
  const subject=`[Xanh24 Pioneer] Xác nhận - ${d.full_name}`;
  const body=`Chào ${d.full_name},\n\nCảm ơn bạn đã đăng ký (${getTypeLabel(d.customer_type)} - ${d.city}).\nĐội ngũ Xanh24 sẽ liên hệ SĐT ${d.phone} trong 15 phút.\n\nNội dung: ${d.work_content||d.school||''}\n\nTrân trọng,\nXanh24 x MB Bank`;
  window.open(`mailto:${d.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,'_blank');
}
function sendBulkSMS(){
  const selected=[...document.querySelectorAll('.row-check:checked')].map(c=>filtered.find(d=>d.id===c.dataset.id)).filter(Boolean);
  const targets=selected.length?selected:filtered;
  const phones=targets.map(t=>t.phone).filter(Boolean).join(', ');
  if(!phones){alert('Không có SĐT');return;}
  const text=`Chào bạn, Xanh24 đã nhận được đăng ký giữ suất Pioneer của bạn. Đội ngũ sẽ gọi lại trong 15p. Hotline 1900 2468`;
  alert(`Danh sách SĐT (${targets.length}):\n${phones}\n\nNội dung SMS mẫu:\n${text}\n\nCopy và dán vào tool SMS Brandname / Zalo OA để gửi hàng loạt.\nHoặc xuất Excel để import.`);
}
loadData();
</script>
</body>
</html>

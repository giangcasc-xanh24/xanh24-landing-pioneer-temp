
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xanh24 Admin V15</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 p-6"><div class="max-w-7xl mx-auto">
<h1 class="text-2xl font-bold">Xanh24 Pioneer - Admin V15 FINAL</h1><p class="text-sm text-gray-500">Key mới đã cập nhật - 3 cột city, customer_type, work_content</p>
<div class="grid grid-cols-4 gap-4 mt-6"><div class="bg-white p-4 border rounded-xl"><div class="text-xs text-gray-500">Tổng leads</div><div id="total" class="text-2xl font-bold">-</div></div><div class="bg-white p-4 border rounded-xl"><div class="text-xs">🎓 Sinh viên</div><div id="sv" class="text-2xl font-bold text-green-600">-</div></div><div class="bg-white p-4 border rounded-xl"><div class="text-xs">🏫 Nhà trường</div><div id="truong" class="text-2xl font-bold text-blue-600">-</div></div><div class="bg-white p-4 border rounded-xl"><div class="text-xs">🤝 Đối tác</div><div id="dt" class="text-2xl font-bold text-purple-600">-</div></div></div>
<div class="bg-white p-4 border rounded-xl mt-4 flex gap-3"><input id="search" placeholder="Tìm tên, SĐT..." class="flex-1 px-4 py-2 border rounded-lg" oninput="filter()"><select id="ftype" class="px-4 py-2 border rounded-lg" onchange="filter()"><option value="">Tất cả</option><option value="sinh_vien">Sinh viên</option><option value="nha_truong">Nhà trường</option><option value="doi_tac">Đối tác</option></select><button onclick="load()" class="px-4 py-2 bg-black text-white rounded-lg">🔄 Refresh</button><button onclick="exportCSV()" class="px-4 py-2 bg-green-600 text-white rounded-lg">📥 CSV</button><button onclick="exportExcel()" class="px-4 py-2 bg-white border rounded-lg">📊 Excel</button></div>
<table class="w-full bg-white mt-4 border text-sm"><thead><tr class="bg-gray-100"><th class="p-3">Thời gian</th><th class="p-3">Loại</th><th class="p-3">Tên</th><th class="p-3">TP</th><th class="p-3">SĐT</th><th class="p-3">Email</th><th class="p-3">Nội dung</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<script>
const SB_URL="https://imwzcdobpvuuwfadaxbb.supabase.co";const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imltd3pjZG9icHZ1dXdmYWRheGJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDc5MTMsImV4cCI6MjEwNDU4MzkxM30.sN4jiyBUMfbLDrwsO0w3XDIgwn-LzLd25L8R_yIV10E";
let all=[];let filtered=[];
async function load(){const tb=document.getElementById('tbody');tb.innerHTML='<tr><td colspan=7 class="p-8 text-center">Loading...</td></tr>';try{const r=await fetch(SB_URL+'/rest/v1/pioneer_leads?select=*&order=created_at.desc&limit=1000',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});const data=await r.json();console.log(data);if(!Array.isArray(data))throw new Error(JSON.stringify(data));all=data;document.getElementById('total').textContent=data.length;document.getElementById('sv').textContent=data.filter(d=>d.customer_type==='sinh_vien').length;document.getElementById('truong').textContent=data.filter(d=>d.customer_type==='nha_truong').length;document.getElementById('dt').textContent=data.filter(d=>d.customer_type==='doi_tac').length;filtered=data;render();}catch(e){tb.innerHTML=`<tr><td colspan=7 class="p-8 text-center text-red-600">Lỗi: ${e.message}</td></tr>`;}}
function filter(){const q=document.getElementById('search').value.toLowerCase();const t=document.getElementById('ftype').value;filtered=all.filter(d=>{const mq=!q||d.full_name?.toLowerCase().includes(q)||d.phone?.includes(q);const mt=!t||d.customer_type===t;return mq&&mt;});render();}
function render(){const tb=document.getElementById('tbody');if(filtered.length===0){tb.innerHTML='<tr><td colspan=7 class="p-8 text-center">Không có data</td></tr>';return;}tb.innerHTML=filtered.map(d=>`<tr class="border-b"><td class="p-3 text-xs">${new Date(d.created_at).toLocaleString('vi-VN')}</td><td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${d.customer_type==='sinh_vien'?'bg-green-100':d.customer_type==='nha_truong'?'bg-blue-100':'bg-purple-100'}">${d.customer_type||''}</span></td><td class="p-3 font-bold">${d.full_name||''}</td><td class="p-3">${d.city||''}</td><td class="p-3 font-mono">${d.phone||''}</td><td class="p-3 text-xs">${d.email||''}</td><td class="p-3 max-w-xs truncate">${d.work_content||d.school||''}</td></tr>`).join('');}
function exportCSV(){const h=['created_at','customer_type','full_name','city','phone','email','work_content','school'];const rows=[h.join(',')].concat(filtered.map(d=>h.map(k=>`"${(d[k]||'').toString().replace(/"/g,'""')}"`.trim()).join(',')));const b=new Blob([rows.join('\n')],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`xanh24-v15-${new Date().toISOString().slice(0,10)}.csv`;a.click();}
function exportExcel(){const h=['Ngày','Loại','Tên','TP','SĐT','Email','Nội dung'];const rows=[h.join('\t')].concat(filtered.map(d=>[new Date(d.created_at).toLocaleString('vi-VN'),d.customer_type||'',d.full_name||'',d.city||'',d.phone||'',d.email||'',(d.work_content||'').replace(/\n/g,' ')].join('\t')));const b=new Blob(['\ufeff'+rows.join('\n')],{type:'application/vnd.ms-excel'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`xanh24-v15-${new Date().toISOString().slice(0,10)}.xls`;a.click();}
load();
</script></body></html>

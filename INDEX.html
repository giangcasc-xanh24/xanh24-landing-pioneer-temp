    const name=targets[0]?.value?.trim()||"", phone=targets[1]?.value?.trim()||"", school=targets[2]?.value?.trim()||"";
    console.log("Click",{name,phone,school});
    if(!phone||phone.length<9){alert("Nhập SĐT"); return;}
    const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML="Đang lưu...";
    try{
      await saveLead(name,phone,school);
      btn.innerHTML="✓ Đã giữ suất thành công!";
      btn.style.background="#00A651";
      let msg=document.querySelector('.v6-msg');
      if(!msg){msg=document.createElement('div'); msg.className='v6-msg'; msg.style.cssText='margin-top:12px;padding:12px;background:#e6ffed;border:1px solid #a7f3d0;color:#065f46;border-radius:8px;text-align:center;font-weight:700'; btn.parentNode.appendChild(msg);}
      msg.innerHTML="✓ Đã lưu vào Supabase! Refresh Table sẽ thấy ngay 🎉";
      console.log("DONE 201");
    }catch(err){console.error(err); alert("Lỗi: "+err.message); btn.disabled=false; btn.innerHTML=orig;}
  });
}
setTimeout(hookV6,800); setTimeout(hookV6,2000); setTimeout(hookV6,4000);
document.addEventListener('DOMContentLoaded',()=>setTimeout(hookV6,500));
